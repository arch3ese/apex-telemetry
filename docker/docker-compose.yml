services:
  postgres:
    image: postgres:16-alpine
    container_name: apex_telemetry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_password
      POSTGRES_DB: apex_telemetry
    ports:
      - "5432:5432"
    volumes:
      - apex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_user -d apex_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  apex_pgdata:
    driver: local
