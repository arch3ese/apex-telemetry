name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex_user
          POSTGRES_PASSWORD: apex_password
          POSTGRES_DB: apex_telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint & Code Style Check (Ruff)
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://apex_user:apex_password@localhost:5432/apex_telemetry
          SYNC_DATABASE_URL: postgresql+psycopg://apex_user:apex_password@localhost:5432/apex_telemetry
        run: |
          alembic upgrade head

      - name: Run Test Suite (Unit, Integration & API)
        env:
          DATABASE_URL: postgresql+asyncpg://apex_user:apex_password@localhost:5432/apex_telemetry
          SYNC_DATABASE_URL: postgresql+psycopg://apex_user:apex_password@localhost:5432/apex_telemetry
        run: |
          pytest -v

      - name: Verify Deterministic Seed Pipeline
        env:
          DATABASE_URL: postgresql+asyncpg://apex_user:apex_password@localhost:5432/apex_telemetry
          SYNC_DATABASE_URL: postgresql+psycopg://apex_user:apex_password@localhost:5432/apex_telemetry
        run: |
          python scripts/seed_data.py --samples 50
